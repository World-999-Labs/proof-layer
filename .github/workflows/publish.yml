name: Publish package

# Tag-triggered publishing for the three public packages.
#
# How to release:
#   1. Bump the version in packages/<pkg>/package.json
#   2. Commit + push to main
#   3. Create + push a tag matching the package + new version:
#        git tag sdk-v1.0.1     && git push origin sdk-v1.0.1
#        git tag verify-v1.0.3  && git push origin verify-v1.0.3
#        git tag mcp-v1.0.1     && git push origin mcp-v1.0.1
#
# This workflow then:
#   - builds that one package
#   - publishes the @proof-layer/<name> artifact to npmjs.org
#   - re-scopes a copy to @world-999-labs/<name> and publishes it to
#     GitHub Packages (GH requires the scope to match the org owner)
#   - for mcp only: publishes to the official MCP Registry via OIDC
#
# Required GitHub repo secret:
#   NPM_TOKEN  — an npmjs.org "Automation" token with publish rights on
#                the @proof-layer scope.

on:
  push:
    tags:
      - "sdk-v*"
      - "verify-v*"
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish (sdk | verify | mcp)"
        required: true
        type: choice
        options: [sdk, verify, mcp]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for npm provenance AND MCP OIDC

    steps:
      - name: Resolve package name from tag or input
        id: pkg
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            PKG="${{ inputs.package }}"
          else
            TAG="${GITHUB_REF##*/}"
            PKG="${TAG%%-v*}"
          fi
          case "$PKG" in
            sdk|verify|mcp) ;;
            *) echo "::error::Unknown package '$PKG'"; exit 1 ;;
          esac
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "Publishing package: $PKG"

      - uses: actions/checkout@v4

      - name: Setup Node + npmjs.org registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@proof-layer"

      - name: Install workspace deps
        run: npm ci

      - name: Build package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm run build

      # ── 1) Publish to npmjs.org as @proof-layer/<name> ──────────────
      - name: Publish to npmjs.org
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # ── 2) Re-scope and publish to GitHub Packages ──────────────────
      - name: Re-scope package.json for GitHub Packages
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name = p.name.replace('@proof-layer/', '@world-999-labs/');
            p.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            console.log('Re-scoped to', p.name);
          "

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@world-999-labs"

      - name: Publish to GitHub Packages
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

      # ── 3) Publish to the official MCP Registry (mcp package only) ──
      # Uses GitHub Actions OIDC — no manual token needed. The MCP
      # Registry trusts the OIDC claim that we're running inside the
      # World-999-Labs/proof-layer repo, which proves ownership of the
      # io.github.World-999-Labs/* namespace.
      - name: Restore original package.json
        if: steps.pkg.outputs.name == 'mcp'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: git checkout -- package.json

      - name: Install mcp-publisher
        if: steps.pkg.outputs.name == 'mcp'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Login to MCP Registry via GitHub OIDC
        if: steps.pkg.outputs.name == 'mcp'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.pkg.outputs.name == 'mcp'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: ../../mcp-publisher publish

      - name: Summary
        run: |
          echo "### Published \`${{ steps.pkg.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npmjs.org: https://www.npmjs.com/package/@proof-layer/${{ steps.pkg.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Packages: https://github.com/World-999-Labs/proof-layer/pkgs/npm/${{ steps.pkg.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pkg.outputs.name }}" = "mcp" ]; then
            echo "- MCP Registry: https://registry.modelcontextprotocol.io/v0/servers?search=proof-layer" >> "$GITHUB_STEP_SUMMARY"
          fi
