name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'mcp-v*.*.*'
      - 'verify-v*.*.*'

jobs:
  build-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build mcp (verify before tagging)
        run: cd packages/mcp && npm install && npm run build
      - name: Build verify (verify before tagging)
        run: cd packages/verify && npm install && npm run build

  publish-mcp:
    if: startsWith(github.ref, 'refs/tags/mcp-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: cd packages/mcp && npm install
      - name: Build
        run: cd packages/mcp && npm run build
      - name: Publish
        run: cd packages/mcp && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

  publish-verify:
    if: startsWith(github.ref, 'refs/tags/verify-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: cd packages/verify && npm install
      - name: Build
        run: cd packages/verify && npm run build
      - name: Publish
        run: cd packages/verify && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
