<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- Cryptographic hash motif (top right corner) -->
  <g opacity="0.35" font-family="JetBrains Mono, Menlo, monospace" font-size="13" fill="#3b82f6">
    <text x="1230" y="40" text-anchor="end">sha256: 4d1b9278…3a9c9817</text>
    <text x="1230" y="60" text-anchor="end">ed25519: 0a1f3c…b8e9d2</text>
    <text x="1230" y="80" text-anchor="end">chain: 147 receipts • 0 broken</text>
  </g>

  <!-- Wordmark -->
  <text x="80" y="240" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="120" fill="#ffffff" letter-spacing="-3">
    Proof Layer
  </text>

  <!-- Tagline -->
  <text x="80" y="310" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="36" fill="#cbd5e1">
    Cryptographic governance receipts for AI agents
  </text>

  <!-- Sub-tagline -->
  <text x="80" y="360" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Issued before the agent acts. Ed25519-signed. Hash-chained. Verifiable offline.
  </text>

  <!-- Package chips -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="280" height="56" rx="8" fill="#0d1f33" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="20" y="36" font-family="JetBrains Mono, Menlo, monospace" font-size="22" fill="#00e5ff">@proof-layer/mcp</text>

    <rect x="300" y="0" width="320" height="56" rx="8" fill="#0d1f33" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="320" y="36" font-family="JetBrains Mono, Menlo, monospace" font-size="22" fill="#a78bfa">@proof-layer/verify</text>
  </g>

  <!-- Footer URL -->
  <text x="80" y="580" font-family="JetBrains Mono, Menlo, monospace" font-size="20" fill="#64748b">
    prooflayer.world999labs.com
  </text>

  <!-- WORLD999_LABS mark (bottom right) -->
  <text x="1200" y="580" text-anchor="end" font-family="JetBrains Mono, Menlo, monospace" font-size="16" fill="#475569" letter-spacing="2">
    WORLD999_LABS
  </text>
</svg>
